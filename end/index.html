<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <style>
        /* Centrado total en la pantalla */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff; /* Fondo blanco limpio */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .contenedor {
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Estilo del botón */
        .boton {
            display: inline-block;
            padding: 15px 40px;
            background-color: #007bff; /* Azul profesional */
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        /* Efecto al pasar el mouse */
        .boton:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>¡FELICIDADES!</h1>
        <p>Haz encontrado una carta super rara, click aquí para descubrir cuál es!.</p>
        
        <a href="https://irocum.github.io/card" class="boton">
            Ir a la página →
        </a>
    </div>

</body>
</html>
